<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aaron Cope — Contact</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      border: 1px solid var(--border);
      margin-top: 32px;
    }
    .contact-item {
      padding: 40px 32px;
      background: var(--bg);
      border-right: 1px solid var(--border);
    }
    .contact-item:last-child { border-right: none; }
    .contact-item-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    @media (max-width: 600px) {
      .contact-grid { grid-template-columns: 1fr; }
      .contact-item { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo">Aaron Cope</a>
    <ul class="nav-links">
      <li><a href="about.html">About</a></li>
      <li><a href="engineering.html">Engineering</a></li>
      <li><a href="education.html">Education</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>

  <main>
    <div class="page-header">
      <p class="page-label">Contact</p>
      <h1 class="page-title">Get in Touch</h1>
      <p class="page-subtitle">I'm always open to connecting — whether it's about projects, opportunities, or collaboration.</p>
    </div>

    <div class="content">
      <div class="section">
        <div class="contact-grid">
          <div class="contact-item">
            <p class="contact-item-label">Email</p>
            <a href="mailto:aaron.cope@yale.edu" class="contact-link">aaron.cope@yale.edu</a>
          </div>
          <div class="contact-item">
            <p class="contact-item-label">GitHub</p>
            <a href="https://github.com/aaroncope" target="_blank" class="contact-link">github.com/aaroncope</a>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
